name: Pages

# main に入ったら site/ だけを GitHub Pages に公開する。
# docs/・CLAUDE.md・.github/ などページでないファイルは公開しない。
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# 公開が重なったら、後から来たほうを待たせる（途中で止めない）
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: site/ を公開
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: チェックアウト
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # アクションはタグではなくコミットSHAで固定する（タグの差し替えによる改ざん対策）
      - name: Pages の準備
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: site/ をアップロード
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

      - name: 公開
        id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
